<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BodyTalk">
<meta name="theme-color" content="#080C0E">
<title>BodyTalk Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#080C0E;
    --card:rgba(255,255,255,.045);
    --card-hi:rgba(255,255,255,.08);
    --edge:rgba(255,255,255,.09);
    --edge-2:rgba(255,255,255,.17);
    --text:#F2F6F5;
    --text-2:rgba(242,246,245,.60);
    --text-3:rgba(242,246,245,.34);
    --em:#3DDC97;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--void);color:var(--text);
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.012em;
    overscroll-behavior-y:none;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(110% 80% at 5% -5%, rgba(16,185,129,.17) 0%, transparent 55%),
      radial-gradient(90% 60% at 100% 15%, rgba(6,95,70,.22) 0%, transparent 60%);
  }
  #app{position:relative;z-index:1;max-width:900px;margin:0 auto;min-height:100dvh;
    display:flex;flex-direction:column;}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:20;flex-shrink:0;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
    background:rgba(8,12,14,.78);backdrop-filter:blur(22px) saturate(170%);
    border-bottom:1px solid var(--edge);}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .brand{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;
    font-size:10px;letter-spacing:.17em;color:var(--text-3);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);flex-shrink:0;}
  .dot.on{background:var(--em);box-shadow:0 0 9px var(--em);}
  .dot.err{background:#F87171;}
  .tabs{display:flex;background:var(--card);border:1px solid var(--edge);
    border-radius:99px;padding:3px;gap:2px;flex-shrink:0;}
  .tab{background:none;border:none;color:var(--text-2);padding:6px 14px;font-size:12.5px;
    font-weight:500;cursor:pointer;border-radius:99px;font-family:inherit;transition:.18s;}
  .tab.active{background:var(--text);color:var(--void);font-weight:600;}

  .crumbs{display:flex;flex-wrap:wrap;gap:5px;align-items:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-3);letter-spacing:.05em;}
  .crumbs button{background:none;border:none;color:var(--em);font:inherit;padding:0;cursor:pointer;}
  .crumbs button.here{color:var(--text-2);}

  main{flex:1;padding:20px 18px 30px;}

  /* ---------- level navigation ---------- */
  .nav{display:flex;gap:10px;margin-bottom:20px;}
  .nav button{
    flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
    background:var(--card);border:1px solid var(--edge-2);color:var(--text);
    border-radius:16px;padding:15px 14px;font-family:inherit;font-size:15px;
    font-weight:500;cursor:pointer;transition:.16s;letter-spacing:-.01em;
  }
  .nav button:active{background:var(--card-hi);transform:scale(.98);}
  .nav .g{font-size:17px;line-height:1;color:var(--em);}
  .nav .home{flex:0 0 auto;padding:15px 20px;}

  /* ---------- headline ---------- */
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--em);
    letter-spacing:.2em;text-transform:uppercase;}
  h1{font-weight:300;font-size:clamp(26px,7vw,40px);line-height:1.08;margin:9px 0 0;
    letter-spacing:-.035em;}
  .sub{color:var(--text-2);font-size:14px;font-weight:300;margin-top:8px;}

  /* ---------- card grid ---------- */
  .grid{display:grid;gap:11px;margin-top:24px;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .grid.wide{grid-template-columns:1fr;}

  .card{position:relative;background:var(--card);border:1px solid var(--edge);
    border-radius:var(--r);padding:16px;cursor:pointer;transition:.16s;
    display:flex;flex-direction:column;gap:9px;min-height:96px;
    -webkit-user-select:none;user-select:none;}
  .card:active{background:var(--card-hi);transform:scale(.985);}
  .card.wide{min-height:0;flex-direction:row;align-items:center;gap:14px;}
  .card.picked{border-color:var(--em);background:rgba(61,220,151,.10);}

  .c-accent{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;}
  .c-code{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-3);
    letter-spacing:.1em;}
  .c-name{font-size:15.5px;font-weight:400;line-height:1.28;flex:1;}
  .card.wide .c-name{font-size:17px;}
  .c-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;}
  .c-count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-3);}
  .c-leaf{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--em);
    letter-spacing:.12em;text-transform:uppercase;}

  .c-add{width:30px;height:30px;flex-shrink:0;border-radius:50%;border:1px solid var(--edge-2);
    background:transparent;color:var(--text-3);font-size:16px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:300;}
  .c-add.on{background:var(--em);border-color:var(--em);color:var(--void);font-weight:600;}

  /* ---------- detail ---------- */
  .tag{display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.28);
    border-radius:99px;padding:7px 13px;margin-top:20px;color:var(--em);letter-spacing:.09em;}
  .field{margin-top:16px;background:var(--card);border:1px solid var(--edge);
    border-radius:var(--r);padding:17px 19px;}
  .field-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.19em;
    text-transform:uppercase;color:var(--text-3);margin-bottom:9px;}
  .field-body{font-size:15px;line-height:1.6;font-weight:300;}
  .field-body.src{font-size:12.5px;color:var(--text-2);font-family:'IBM Plex Mono',monospace;line-height:1.55;}
  .dtabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--edge);
    border-radius:99px;padding:3px;margin-top:18px;width:fit-content;}
  .dtab{background:none;border:none;color:var(--text-2);padding:7px 16px;font-size:12.5px;
    font-weight:500;cursor:pointer;border-radius:99px;font-family:inherit;transition:.18s;}
  .dtab.on{background:var(--text);color:var(--void);font-weight:600;}
  .dtab .n{font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.6;margin-left:5px;}

  .figs{margin-top:16px;display:flex;flex-direction:column;gap:14px;}
  .fig{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);
    overflow:hidden;}
  .fig .imgwrap{background:#fff;display:flex;align-items:center;justify-content:center;
    padding:14px;min-height:120px;}
  .fig img{max-width:100%;max-height:340px;object-fit:contain;display:block;}
  .fig .cap{padding:12px 14px;font-size:13.5px;line-height:1.45;font-weight:300;}
  .fig .meta{padding:0 14px 12px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    color:var(--text-3);line-height:1.5;letter-spacing:.03em;}
  .fig .meta a{color:var(--text-3);}
  .fig .fail{padding:14px;font-size:12.5px;color:var(--text-3);font-weight:300;}

  .btn{width:100%;margin-top:22px;background:var(--text);border:none;color:var(--void);
    font-size:14.5px;font-weight:600;padding:16px;cursor:pointer;font-family:inherit;
    border-radius:99px;}
  .btn.ghost{background:transparent;color:var(--em);border:1px solid var(--em);}

  .note{margin-top:18px;padding:18px;border-radius:var(--r);background:var(--card);
    border:1px solid var(--edge);color:var(--text-2);font-size:14px;line-height:1.55;font-weight:300;}
  .note.err{border-color:rgba(248,113,113,.3);color:#FCA5A5;}
  .loading{text-align:center;color:var(--text-3);font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;letter-spacing:.14em;padding:40px 0;}

  /* ---------- session tray ---------- */
  .tray{position:sticky;bottom:0;z-index:15;flex-shrink:0;
    background:rgba(8,12,14,.85);backdrop-filter:blur(24px) saturate(170%);
    border-top:1px solid var(--edge);padding:12px 18px calc(12px + env(safe-area-inset-bottom));}
  .tray-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .tray-title{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-3);
    text-transform:uppercase;letter-spacing:.18em;}
  .tray-btns{display:flex;gap:6px;}
  .mini{background:transparent;border:1px solid var(--edge-2);color:var(--text-2);
    border-radius:99px;padding:6px 13px;font-size:11.5px;cursor:pointer;font-family:inherit;font-weight:500;}
  .mini.go{background:var(--text);border-color:var(--text);color:var(--void);font-weight:600;}
  .mini:disabled{opacity:.26;}
  .f-label{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-3);
    letter-spacing:.13em;text-transform:uppercase;margin-bottom:5px;}
  .tray-empty{color:var(--text-3);font-size:12.5px;font-weight:300;}
  .tray-scroll{max-height:34dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  /* formula: linear chains, indented only for declared sub-formulas */
  .froot{margin-bottom:11px;}
  .chain{display:flex;flex-wrap:wrap;align-items:center;gap:5px;}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid var(--edge);border-radius:99px;padding:6px 12px;font-size:12.5px;
    cursor:pointer;}
  .chip.here{border-color:var(--em);background:rgba(61,220,151,.13);}
  .chip .cc{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--em);}
  .chip .x{color:var(--text-3);cursor:pointer;font-size:14px;line-height:1;}
  .link{color:var(--em);font-size:11px;}
  .sub{position:relative;margin:5px 0 5px 0;padding-left:16px;}
  .sub-row{display:flex;align-items:flex-start;gap:7px;}
  .toggle{flex-shrink:0;width:20px;height:20px;margin-top:6px;border-radius:6px;
    border:1px solid var(--edge-2);background:var(--card);color:var(--em);
    font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-family:'IBM Plex Mono',monospace;padding:0;}
  .toggle:active{background:var(--card-hi);}
  .collapsed-tag{display:inline-flex;align-items:center;gap:7px;background:var(--card);
    border:1px dashed var(--edge-2);border-radius:99px;padding:6px 12px;font-size:11.5px;
    color:var(--text-2);cursor:pointer;margin:4px 0;font-family:'IBM Plex Mono',monospace;
    letter-spacing:.06em;}
  .sub::before{content:"";position:absolute;left:0;top:-4px;bottom:14px;width:1px;
    background:var(--edge-2);}
  .sub::after{content:"";position:absolute;left:0;top:16px;width:12px;height:1px;
    background:var(--edge-2);}
  .hint{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-3);
    letter-spacing:.1em;text-transform:uppercase;margin:2px 0 6px;}

  /* ---------- mic ---------- */
  .mic{position:fixed;right:18px;bottom:calc(112px + env(safe-area-inset-bottom));z-index:18;
    width:54px;height:54px;border-radius:50%;border:1px solid var(--edge-2);
    background:rgba(14,20,23,.9);backdrop-filter:blur(20px);color:var(--text-2);
    font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .mic.live{background:var(--em);border-color:var(--em);color:var(--void);
    animation:pulse 1.9s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(61,220,151,.5);}
    70%{box-shadow:0 0 0 16px rgba(61,220,151,0);}
    100%{box-shadow:0 0 0 0 rgba(61,220,151,0);}
  }
  .heard{position:fixed;left:18px;right:84px;bottom:calc(122px + env(safe-area-inset-bottom));
    z-index:18;background:rgba(14,20,23,.93);backdrop-filter:blur(20px);
    border:1px solid var(--edge-2);border-radius:14px;padding:11px 14px;font-size:13.5px;
    display:none;font-weight:300;max-width:520px;}
  .heard .hl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--em);
    letter-spacing:.17em;text-transform:uppercase;display:block;margin-bottom:4px;}
  .heard.bad .hl{color:#F87171;}
  .cands{position:fixed;left:18px;right:18px;bottom:calc(122px + env(safe-area-inset-bottom));
    z-index:19;background:rgba(14,20,23,.96);backdrop-filter:blur(26px);
    border:1px solid var(--edge-2);border-radius:20px;padding:16px 18px;display:none;
    max-width:520px;margin:0 auto;}
  .cands .cl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--em);
    letter-spacing:.17em;text-transform:uppercase;margin-bottom:3px;}
  .cands .cq{font-size:14.5px;color:var(--text-2);font-weight:300;margin-bottom:12px;}
  .cand{display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer;
    border-top:1px solid var(--edge);}
  .cand .cn{width:25px;height:25px;flex-shrink:0;border-radius:50%;border:1px solid var(--em);
    color:var(--em);display:flex;align-items:center;justify-content:center;font-size:11.5px;
    font-family:'IBM Plex Mono',monospace;}
  .cand .ctn{font-size:15.5px;}
  .cand .ctc{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-3);}
  .cands .cx{margin-top:11px;text-align:center;font-size:13px;color:var(--text-3);
    cursor:pointer;padding-top:11px;border-top:1px solid var(--edge);}

  /* ---------- sessions ---------- */
  .sess{background:var(--card);border:1px solid var(--edge);border-radius:22px;
    padding:19px;margin-bottom:13px;}
  .sess-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:11px;}
  .sess-t{font-weight:400;font-size:20px;letter-spacing:-.025em;}
  .sess-d{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-3);flex-shrink:0;}
  .sess-n{font-size:13.5px;color:var(--text-2);margin-bottom:15px;line-height:1.5;font-weight:300;}
  .dgf{background:rgba(255,255,255,.028);border:1px solid var(--edge);border-radius:15px;
    padding:14px 16px;margin-bottom:11px;}
  .dgl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.18em;
    color:var(--em);text-transform:uppercase;margin-bottom:10px;}
  .dgs{display:flex;gap:11px;padding:3px 0;}
  .dgn{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-3);
    width:14px;flex-shrink:0;padding-top:4px;}
  .dgc{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-3);}
  .dgm{font-size:14.5px;font-weight:300;line-height:1.35;}
  .dga{color:var(--em);font-size:10px;margin-left:25px;}
  .del{background:none;border:none;color:var(--text-3);font-size:12px;cursor:pointer;
    font-family:inherit;border-bottom:1px solid var(--edge-2);padding:0;}

  input,textarea{width:100%;background:var(--card);border:1px solid var(--edge);color:var(--text);
    font-family:inherit;font-size:16px;padding:14px;margin-bottom:10px;border-radius:14px;font-weight:300;}
  textarea{min-height:82px;resize:vertical;}
  input::placeholder,textarea::placeholder{color:var(--text-3);}
  input:focus,textarea:focus{outline:none;border-color:var(--em);}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);
    z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:rgba(14,20,23,.97);backdrop-filter:blur(28px);border-top:1px solid var(--edge-2);
    border-radius:26px 26px 0 0;width:100%;max-width:900px;
    padding:12px 18px calc(22px + env(safe-area-inset-bottom));}
  .grab{width:38px;height:4px;background:var(--edge-2);border-radius:99px;margin:0 auto 18px;}
  .modal h3{font-size:21px;margin:0 0 17px;font-weight:300;letter-spacing:-.03em;}
  .mb{display:flex;gap:10px;margin-top:6px;}
  .mb button{flex:1;padding:15px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;
    border:1px solid var(--edge-2);border-radius:99px;background:transparent;color:var(--text);}
  .mb .go{background:var(--text);color:var(--void);border-color:var(--text);}
  /* ---------- access gate ---------- */
  #gate{position:fixed;inset:0;z-index:200;background:var(--void);
    display:flex;align-items:center;justify-content:center;padding:24px;}
  #gate::before{content:"";position:absolute;inset:0;
    background:radial-gradient(110% 80% at 20% 0%, rgba(16,185,129,.18) 0%, transparent 58%);}
  .gate-box{position:relative;width:100%;max-width:360px;text-align:center;}
  .gate-mark{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--em);margin-bottom:14px;}
  .gate-box h2{font-weight:300;font-size:30px;letter-spacing:-.035em;margin:0 0 8px;}
  .gate-box p{color:var(--text-2);font-size:14px;font-weight:300;margin:0 0 26px;line-height:1.5;}
  .gate-box input{text-align:center;font-size:19px;letter-spacing:.08em;padding:16px;
    border-radius:16px;margin-bottom:12px;}
  .gate-box button{width:100%;background:var(--text);border:none;color:var(--void);
    font-size:15px;font-weight:600;padding:16px;border-radius:99px;cursor:pointer;
    font-family:inherit;}
  .gate-err{color:#F87171;font-size:13.5px;margin-top:14px;min-height:18px;font-weight:300;}
  .gate-out{background:none;border:none;color:var(--text-3);font-size:11.5px;
    cursor:pointer;font-family:inherit;margin-top:20px;text-decoration:underline;}

  ::selection{background:rgba(61,220,151,.25);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="topbar">
      <div class="brand"><span class="dot" id="dot"></span><span id="brandText">Loading</span></div>
      <div class="tabs">
        <button class="tab active" id="tBrowse" onclick="setView('browse')">Browse</button>
        <button class="tab" id="tLog" onclick="setView('log')">Log</button>
      </div>
    </div>
    <div class="crumbs" id="crumbs"></div>
  </header>

  <main id="main"><div class="loading">Loading protocol</div></main>
  <div class="tray" id="tray" style="display:none"></div>
</div>

<div id="gate">
  <div class="gate-box">
    <div class="gate-mark">Protected</div>
    <h2>BodyTalk Protocol</h2>
    <p>Enter the access code to open the protocol and your session log.</p>
    <input id="gateCode" type="password" inputmode="text" autocomplete="current-password"
           placeholder="access code" onkeydown="if(event.key==='Enter')tryUnlock()">
    <button onclick="tryUnlock()">Unlock</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<button class="mic" id="mic" onclick="toggleVoice()">●</button>
<div class="heard" id="heard"></div>
<div class="cands" id="cands"></div>

<script>
const API="https://hbkjkxcmqctdmdkrbiiu.supabase.co/functions/v1/protocol-data";

function deviceId(){
  let d=localStorage.getItem("bt_device");
  if(!d){ d="dev_"+Math.random().toString(36).slice(2)+Date.now().toString(36);
    localStorage.setItem("bt_device",d); }
  return d;
}
const DEVICE=deviceId();

let TREE=[],byCode={},NS={},PL={},OC={},IMG={},LINKS={};
let current=null, view="browse";
let detailTab="details";   /* 'details' | 'image' */
let NODES=[];        /* {id,parentId,branch,code,name} */
let activeId=null;   /* where the next pick attaches */
let pendingBranch=false;   /* next pick opens a declared sub-formula */
let collapsed={};          /* node id -> true when its sub-formula is folded */
let sessions=[];
let nid=0;
function newId(){ return "n"+(++nid); }
function childrenOfNode(pid){ return NODES.filter(function(n){return n.parentId===pid;}); }
function nodeById(id){ return NODES.find(function(n){return n.id===id;}); }

const HUE={ "0":"#7DD3C0","1":"#3DDC97","2":"#5EEAD4","3":"#FBBF24","4":"#FB923C","5":"#A78BFA","6":"#F87171" };
function hueOf(c){ return HUE[c.split(".")[0]]||"#7DD3C0"; }

let ACCESS = localStorage.getItem("bt_code") || "";

async function api(qs,opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers||{}, {"x-access-code": ACCESS});
  const r=await fetch(API+qs,opts);
  const d=await r.json();
  if(r.status===401 || d.need_code){ lock(); throw new Error("locked"); }
  if(d.error) throw new Error(d.error);
  return d;
}

function lock(){
  ACCESS=""; localStorage.removeItem("bt_code");
  document.getElementById("gate").style.display="flex";
}
function unlockUI(){ document.getElementById("gate").style.display="none"; }

async function tryUnlock(){
  const el=document.getElementById("gateCode");
  const errEl=document.getElementById("gateErr");
  const code=el.value.trim();
  if(!code) return;
  errEl.textContent="Checking…";
  try{
    const r=await fetch(API+"?action=check",{headers:{"x-access-code":code}});
    const d=await r.json();
    if(r.ok && d.ok){
      ACCESS=code; localStorage.setItem("bt_code",code);
      errEl.textContent=""; el.value="";
      unlockUI();
      await boot();
    } else {
      errEl.textContent="Wrong code.";
    }
  }catch(e){ errEl.textContent="Cannot reach the server."; }
}

async function loadRef(){
  const d=await api("?action=reference");
  TREE=d.nodes;
  byCode={}; TREE.forEach(function(n){byCode[n.code]=n;});
  NS={}; (d.nervous||[]).forEach(function(r){NS[r.code]=r;});
  PL={}; (d.planets||[]).forEach(function(r){PL[r.code]=r;});
  OC={}; (d.organs||[]).forEach(function(r){OC[r.code]=r;});
  IMG={}; (d.images||[]).forEach(function(r){
    const k=r.dimension_table+"|"+r.dimension_code;
    (IMG[k]=IMG[k]||[]).push(r);

async function loadSessions(){

  sessions=d.sessions||[];
}

function natSort(a,b){
  const pa=a.code.split("."),pb=b.code.split(".");
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const x=parseInt(pa[i]||0),y=parseInt(pb[i]||0);
    if(x!==y) return x-y;
  }
  return 0;
}
function kids(code){
  const has=(code!==null&&code!==undefined&&code!=="");
  const depth=has?code.split(".").length+1:1;
  return TREE.filter(function(n){
    if(n.level!==depth) return false;
    if(!has) return true;
    return n.code.indexOf(code+".")===0 && n.code.split(".").length===depth;
  }).sort(natSort);
}
function ancestors(code){
  if(!code) return [];
  const p=code.split(".");
  return p.map(function(_,i){return byCode[p.slice(0,i+1).join(".")];}).filter(Boolean);
}

function picked(c){ return NODES.some(function(n){return n.kind==="step"&&n.code===c;}); }

function togglePick(code,ev){
  if(ev){ ev.stopPropagation(); }
  const ex=NODES.find(function(n){return n.code===code;});
  if(ex){ removeNode(ex.id); return; }
  const id=newId();
  NODES.push({ id:id, parentId:activeId, branch:pendingBranch,
               code:code, name:byCode[code].name });
  pendingBranch=false;
  activeId=id;                       /* the chain continues from here */
  render(); renderTray();
}

function removeNode(id){
  const kill=[id];
  for(let i=0;i<kill.length;i++)
    childrenOfNode(kill[i]).forEach(function(c){ kill.push(c.id); });
  NODES=NODES.filter(function(n){ return kill.indexOf(n.id)<0; });
  if(kill.indexOf(activeId)>=0) activeId=null;
  render(); renderTray();
}

/* tap a chip to continue from there instead of from the last one */
function setActive(id,ev){
  if(ev) ev.stopPropagation();
  activeId = (activeId===id) ? null : id;
  pendingBranch=false;
  renderTray();
}

/* declare a sub-formula: the next pick hangs under the current node, indented */
function startSub(){
  if(!activeId) return;
  pendingBranch=true;
  renderTray();
}

/* close the current sub-formula and continue on the chain it hangs from */
function closeSub(){
  let n = activeId ? nodeById(activeId) : null;
  if(!n) return;
  /* walk up to the node that opened this sub-formula, then step to its parent */
  while(n && !n.branch) n = n.parentId ? nodeById(n.parentId) : null;
  activeId = n && n.parentId ? n.parentId : null;
  pendingBranch=false;
  renderTray();
}
/* is the insertion point currently inside a declared sub-formula? */
function insideSub(){
  let n = activeId ? nodeById(activeId) : null;
  while(n){ if(n.branch) return true; n = n.parentId ? nodeById(n.parentId) : null; }
  return false;
}

function toggleCollapse(id,ev){
  if(ev) ev.stopPropagation();
  collapsed[id] = !collapsed[id];
  renderTray();
}

/* a parallel formula: an independent chain from scratch */
function newFormula(){ activeId=null; pendingBranch=false; renderTray(); }

function total(){ return NODES.length; }
function clearAll(){
  if(!confirm("Clear the current session? Nothing is saved yet.")) return;
  NODES=[]; activeId=null; pendingBranch=false; render(); renderTray();
}

/* ---------- dimension rendering ---------- */
function dimFields(code){
  const lk=LINKS[code];
  if(!lk) return null;
  if(lk.table==="dim_nervous_system"){
    const d=NS[lk.code]; if(!d) return null;
    return {dim:lk.code,rows:[["Anatomy",d.anatomy],["Function",d.function],["Sources",d.sources,1]]};
  }
  if(lk.table==="dim_organ_component"){
    const d=OC[lk.code]; if(!d) return null;
    return {dim:lk.code,rows:[
      ["Organ",d.organ],
      ["Description",d.description],
      ["Sources",d.sources,1]]};
  }
  if(lk.table==="dim_planet"){
    const d=PL[lk.code]; if(!d) return null;
    if(!d.body_parts_ruled&&!d.natural_consciousness&&!d.pathological_consciousness)
      return {dim:lk.code,empty:1};
    return {dim:lk.code,rows:[
      ["Body parts ruled",d.body_parts_ruled],
      ["Natural consciousness",d.natural_consciousness],
      ["Pathological consciousness",d.pathological_consciousness],
      ["Sources",d.sources,1]]};
  }
  return null;
}
function imagesHTML(code){
  const lk=LINKS[code]; if(!lk) return "";
  const list=IMG[lk.table+"|"+lk.code];
  if(!list||!list.length) return "";
  let h='<div class="figs">';
  list.forEach(function(im){
    h+='<div class="fig"><div class="imgwrap">' +
       '<img src="'+im.url+'" alt="'+(im.caption||"").replace(/"/g,"&quot;")+'" loading="lazy" ' +
       'onerror="this.parentElement.innerHTML=&#39;<div class=\\&#39;fail\\&#39;>Image could not be loaded.</div>&#39;">' +
       '</div>';
    if(im.caption) h+='<div class="cap">'+im.caption+'</div>';
    h+='<div class="meta">'+im.credit+'<br>'+im.license+
       (im.source_page?' \u00B7 <a href="'+im.source_page+'" target="_blank" rel="noopener">source</a>':'')+
       '</div></div>';
  });
  return h+'</div>';
}

function dimHTML(code){
  const f=dimFields(code);
  if(!f) return '<div class="note">No dimension linked to this node yet.</div>';
  if(f.empty) return '<div class="tag">'+code+' → '+f.dim+' · awaiting content</div>' +
    '<div class="note">Linked to the dimension, but the content has not been entered yet. ' +
    'Nothing is shown rather than anything invented.</div>';
  let h='<div class="tag">'+code+' → '+f.dim+' · verified</div>';

  const nImg = imageCount(code);
  if(nImg){
    h+='<div class="dtabs">' +
       '<button class="dtab'+(detailTab==="details"?" on":"")+'" onclick="setDetailTab(&#39;details&#39;)">Details</button>' +
       '<button class="dtab'+(detailTab==="image"?" on":"")+'" onclick="setDetailTab(&#39;image&#39;)">Image<span class="n">'+nImg+'</span></button>' +
       '</div>';
  }

  if(nImg && detailTab==="image"){
    h+=imagesHTML(code);
    return h;
  }

  f.rows.forEach(function(r){
    if(!r[1]) return;
    h+='<div class="field"><div class="field-label">'+r[0]+'</div>' +
       '<div class="field-body'+(r[2]?" src":"")+'">'+r[1]+'</div></div>';
  });
  return h;
}

function imageCount(code){
  const lk=LINKS[code]; if(!lk) return 0;
  const l=IMG[lk.table+"|"+lk.code];
  return l?l.length:0;
}

function render(){
  const m=document.getElementById("main");
  document.getElementById("tray").style.display = view==="log" ? "none" : "";
  document.getElementById("crumbs").style.display = view==="log" ? "none" : "";

  renderCrumbs();
  const node=current?byCode[current]:null;
  const ch=kids(current);
  let h="";

  if(current){
    const p=current.split("."); p.pop();
    const upCode = p.length ? p.join(".") : null;
    const upName = upCode ? (byCode[upCode]||{}).name : "Protocol";
    h+='<div class="nav">' +
       '<button onclick="go('+(upCode?"&#39;"+upCode+"&#39;":"null")+')">' +
         '<span class="g">\u2190</span><span>'+short2(upName)+'</span></button>' +
       '<button class="home" onclick="go(null)"><span class="g">\u2302</span></button>' +
       '</div>';
  }
  h+='<div class="eyebrow">'+(node?node.code:"Protocol")+'</div>';

  if(ch.length) h+='<div class="sub">'+ch.length+' inside</div>';

    h+=dimHTML(node.code);

    h+='<button class="btn'+(p?" ghost":"")+'" onclick="togglePick(&#39;'+node.code+'&#39;)">' +
       (p?"✓ Added":"Add to formula")+'</button>';
    h+='<div style="height:30px"></div>';
    h+='<div class="eyebrow" style="color:var(--text-3)">Inside</div>';
  }

  if(ch.length){
    const wide = !current;                 /* top level reads as a list */
    h+='<div class="grid'+(wide?" wide":"")+'">';
    ch.forEach(function(k){
      const n=kids(k.code).length, lk=!!LINKS[k.code], p=picked(k.code);
      h+='<div class="card'+(wide?" wide":"")+(p?" picked":"")+'" onclick="go(&#39;'+k.code+'&#39;)">' +
         '<div class="c-accent" style="background:'+hueOf(k.code)+'"></div>';
      if(wide){
        h+='<div style="flex:1"><div class="c-code">'+k.code+'</div>' +
           '<div class="c-name">'+k.name+'</div></div>' +
           '<div class="c-count">'+(n?n:"")+'</div>';
      } else {
        h+='<div class="c-code">'+k.code+'</div><div class="c-name">'+k.name+'</div>' +
           '<div class="c-foot">' +
           (n?'<span class="c-count">'+n+' inside</span>':(lk?'<span class="c-leaf">detail</span>':'<span></span>')) +
           '<button class="c-add'+(p?" on":"")+'" onclick="togglePick(&#39;'+k.code+'&#39;,event)">'+(p?"✓":"+")+'</button>' +
           '</div>';
      }
      h+='</div>';
    });
    h+='</div>';
  } else if(node){
    h+=dimHTML(node.code);
    const p=picked(node.code);
    h+='<button class="btn'+(p?" ghost":"")+'" onclick="togglePick(&#39;'+node.code+'&#39;)">' +
       (p?"✓ Added":"Add to formula")+'</button>';

}

function short(s){ return s.length>20?s.slice(0,18)+"…":s; }
function short2(s){ return s.length>24?s.slice(0,22)+"…":s; }

function renderTray(){
  const t=document.getElementById("tray");
  const n=total();
  const cur=activeId?nodeById(activeId):null;

  let h='<div class="tray-head"><div class="tray-title">'+n+' selected</div><div class="tray-btns">' +
    '<button class="mini" onclick="startSub()" '+(!activeId?"disabled":"")+'>Sub-formula</button>' +
    '<button class="mini" onclick="closeSub()" '+(!insideSub()?"disabled":"")+'>Close sub</button>' +
    '<button class="mini" onclick="newFormula()" '+(!n?"disabled":"")+'>Parallel</button>' +
    '<button class="mini" onclick="clearAll()" '+(!n?"disabled":"")+'>Clear</button>' +
    '<button class="mini go" onclick="openSave()" '+(!n?"disabled":"")+'>Save</button></div></div>';

  if(!n){
    h+='<div class="tray-empty">Tap + on a card to start a formula.</div>';
    t.innerHTML=h; return;
  }

  h+='<div class="hint">' +
     (pendingBranch ? "Next pick opens a sub-formula under \u201C"+short(cur?cur.name:"")+"\u201D"
       : cur ? "Continues from \u201C"+short(cur.name)+"\u201D" +
               (insideSub()?" \u00B7 inside a sub-formula":"")
             : "Next pick starts a parallel formula") +
     '</div>';

  const roots=childrenOfNode(null);
  h+='<div class="tray-scroll">';
  roots.forEach(function(r,i){
    h+='<div class="froot">';
    if(roots.length>1) h+='<div class="f-label">Formula '+(i+1)+'</div>';
    h+=chainHTML(r);
    h+='</div>';
  });
  h+='</div>';
  t.innerHTML=h;
  requestAnimationFrame(function(){ alignSubs(t); });
}

/* render a node and everything that continues linearly from it,
   dropping declared sub-formulas underneath, indented */
function chainHTML(node){
  let h='<div class="chain">';
  const subs=[];
  let cur=node, first=true;
  while(cur){
    if(!first) h+='<span class="link">\u2014</span>';
    h+=chipHTML(cur);
    first=false;
    const ch=childrenOfNode(cur.id);
    ch.filter(function(c){return c.branch;}).forEach(function(c){
      subs.push({ node:c, from:cur.id });
    });
    const next=ch.find(function(c){return !c.branch;});
    cur=next||null;
  }
  h+='</div>';
  subs.forEach(function(s){
    const folded = !!collapsed[s.node.id];
    h+='<div class="sub" data-from="'+s.from+'"><div class="sub-row">' +
       '<button class="toggle" onclick="toggleCollapse(&#39;'+s.node.id+'&#39;,event)">' +
       (folded?"+":"\u2212")+'</button><div style="flex:1">';
    if(folded){
      h+='<span class="collapsed-tag" onclick="toggleCollapse(&#39;'+s.node.id+'&#39;,event)">' +
         'Sub \u00B7 '+countChain(s.node)+' step'+(countChain(s.node)===1?"":"s")+'</span>';
    } else {
      h+=chainHTML(s.node);
    }
    h+='</div></div></div>';
  });
  return h;
}

/* how many nodes hang below (and including) this one */
function countChain(node){
  let n=1;
  const stack=[node.id];
  while(stack.length){
    const id=stack.pop();
    childrenOfNode(id).forEach(function(c){ n++; stack.push(c.id); });
  }
  return n;
}

/* place each declared sub-formula directly under the chip it branches from */
function alignSubs(scope){
  const root=scope||document;
  root.querySelectorAll(".sub[data-from]").forEach(function(el){
    const from=el.getAttribute("data-from");
    const chip=root.querySelector('.chip[data-chip="'+from+'"]');
    if(!chip) return;
    const box=el.offsetParent||el.parentElement;
    if(!box) return;
    const left=chip.offsetLeft;
    el.style.marginLeft=Math.max(0,left)+"px";
  });
}

function chipHTML(nd){
  const here=nd.id===activeId;
  return '<span class="chip'+(here?" here":"")+'" data-chip="'+nd.id+'" ' +
    'onclick="setActive(&#39;'+nd.id+'&#39;,event)">' +
    '<span class="cc">'+nd.code+'</span>'+short(nd.name)+
    '<span class="x" onclick="removeNode(&#39;'+nd.id+'&#39;)">\u00D7</span></span>';
}

function closeSave(){ const m=document.getElementById("sm"); if(m) m.remove(); }
async function doSave(){
  const title=document.getElementById("sT").value.trim();
  const date=document.getElementById("sD").value;
  const notes=document.getElementById("sN").value.trim();
  if(!NODES.length) return;
  const order={};
  const steps=NODES.map(function(nd){
    const key=nd.parentId||"root";
    order[key]=(order[key]||0)+1;
    return { tmp:nd.id, parent_tmp:nd.parentId, kind:"step",
             is_branch: !!nd.branch, step_no:order[key],
             protocol_code: nd.code };
  });
  const b=document.querySelector(".mb .go"); b.textContent="Saving"; b.disabled=true;
  try{
    await api("?action=save",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({device_id:DEVICE,title:title||null,notes:notes||null,session_date:date,steps:steps})});
    closeSave(); NODES=[]; activeId=null; pendingBranch=false; renderTray();
    await loadSessions(); setView("log");
  }catch(e){ b.textContent="Save"; b.disabled=false; alert("Could not save: "+e.message); }
}
async function delSession(id){
  if(!confirm("Delete this session permanently?")) return;
  try{
    await api("?action=delete",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({session_id:id,device_id:DEVICE})});
    await loadSessions(); render();
  }catch(e){ alert("Could not delete: "+e.message); }
}

function savedTree(rows,pid){
  const roots=rows.filter(function(r){return (r.parent_id||null)===pid;});
  if(!roots.length) return "";
  let h="";
  roots.forEach(function(r,i){
    h+='<div class="froot">';
    if(pid===null && roots.length>1) h+='<div class="f-label">Formula '+(i+1)+'</div>';
    h+=savedChain(rows,r);
    h+='</div>';
  });
  return h;
}
function savedChain(rows,node){
  let h='<div class="chain">';
  const subs=[]; let cur=node, first=true;
  while(cur){
    if(!first) h+='<span class="link">\u2014</span>';
    const nm=(byCode[cur.protocol_code]||{}).name||"\u2014";
    h+='<span class="chip"><span class="cc">'+cur.protocol_code+'</span>'+nm+'</span>';
    first=false;
    const ch=rows.filter(function(x){return x.parent_id===cur.id;});
    ch.filter(function(c){return c.is_branch;}).forEach(function(c){
      subs.push({ node:c, from:cur.id });
    });
    cur=ch.find(function(c){return !c.is_branch;})||null;
  }
  h+='</div>';
  subs.forEach(function(s){
    h+='<div class="sub" data-from="'+s.from+'">'+savedChain(rows,s.node)+'</div>';
  });
  return h;
}

}

  "microbi":"microbes","tossine":"toxins","allergie":"allergies","paure":"fears",
  "fobie":"phobias","eventi":"events","cicatrici":"scars","elementi":"five elements",
  "sensi":"five senses","fuoco":"fire","terra":"earth","metallo":"metal","acqua":"water",
  "legno":"wood","testa":"head","schiena":"back","torace":"chest","addome":"abdomen",
  "arti":"limbs","respirazione":"breathing","emozioni":"emotions","corpo":"body",
  "cistifellea":"gallbladder","colecisti":"gallbladder","mitocondri":"mitochondria","nucleo":"nucleus","membrana":"membrane","giunzione":"junction","golgi":"golgi","microvilli":"microvilli","glicocalice":"glycocalyx","granuli":"granules","pianeti":"planets","mercurio":"mercury","venere":"venus","marte":"mars","giove":"jupiter",
  "saturno":"saturn","urano":"uranus","nettuno":"neptune","plutone":"pluto","luna":"moon",
  "sole":"sun","cicli":"life cycles"
};
const STOP=["vai","alla","allo","alle","ai","al","la","il","lo","le","gli","dei","del","della",
  "delle","di","in","su","per","con","che","apri","mostra","mostrami","portami","voglio",
  "fammi","vedere","punto","nodo","sezione"];

function norm(s){
  return s.toLowerCase().replace(/[àáâ]/g,"a").replace(/[èé]/g,"e").replace(/[ìí]/g,"i")
    .replace(/[òó]/g,"o").replace(/[ùú]/g,"u")
    .replace(/[^a-z0-9\s.]/g," ").replace(/\s+/g," ").trim();
}
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ heard("Speech recognition not available in this browser.",1); return; }
  if(voiceOn){ stopVoice(); return; }
  recog=new SR(); recog.lang="it-IT"; recog.continuous=true; recog.interimResults=false;
  recog.onresult=function(e){
    for(let i=e.resultIndex;i<e.results.length;i++)
      if(e.results[i].isFinal) command(e.results[i][0].transcript);
  };
  recog.onerror=function(e){ if(e.error==="not-allowed"){ heard("Microphone denied.",1); stopVoice(); } };
  recog.onend=function(){ if(voiceOn){ try{recog.start();}catch(x){} } };
  try{ recog.start(); }catch(x){}
  voiceOn=true;
  document.getElementById("mic").classList.add("live");
  heard('Listening — say “dettaglio”, a node name, or “aggiungi”');
}
function stopVoice(){
  voiceOn=false; hideCands();
  if(recog){ try{recog.stop();}catch(x){} recog=null; }
  document.getElementById("mic").classList.remove("live");
  hideHeard();
}
function heard(msg,bad){
  const el=document.getElementById("heard");
  el.className="heard"+(bad?" bad":"");
  el.innerHTML='<span class="hl">'+(bad?"Not understood":"Heard")+'</span>'+msg;
  el.style.display="block";
  clearTimeout(el._t); el._t=setTimeout(function(){el.style.display="none";},5000);
}
function hideHeard(){ document.getElementById("heard").style.display="none"; }
function say(t){
  if(!window.speechSynthesis) return;
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang="it-IT"; u.rate=1.02;
    speechSynthesis.speak(u);
  }catch(e){}
}
function command(raw){
  const t=norm(raw);
  if(t.length<3) return;
  heard(raw);
  if(CANDS.length){
    const nm={"uno":0,"primo":0,"1":0,"due":1,"secondo":1,"2":1,"tre":2,"terzo":2,"3":2,"quattro":3,"4":3};
    for(const k in nm) if(new RegExp("\\b"+k+"\\b").test(t)){ pickCand(nm[k]); return; }
    if(/(annulla|niente)/.test(t)){ hideCands(); return; }
  }
  if(/\b(dettaglio|dettagli|entra)\b/.test(t)){ if(current) detail(current); return; }
  if(/\b(indietro|torna|esci)\b/.test(t)){
    if(current){ const p=current.split("."); p.pop(); go(p.length?p.join("."):null);
      say(current?byCode[current].name:"Protocollo"); }
    return;
  }
  if(/\b(protocollo|inizio|home)\b/.test(t)){ go(null); say("Protocollo"); return; }
  if(/\b(sessioni|registro)\b/.test(t)){ setView("log"); say("Sessioni"); return; }
  if(/\b(aggiungi|prendi)\b/.test(t)){ if(current){ togglePick(current); say("Aggiunto"); } return; }
  if(/\b(parallela|nuova formula)\b/.test(t)){ newFormula(); say("Nuova formula"); return; }
  if(/\b(sottoformula|sotto formula|ramo)\b/.test(t)){ startSub(); say("Sottoformula"); return; }
  if(/\b(chiudi)\b/.test(t)){ closeSub(); say("Tornato al ramo principale"); return; }
  if(/\b(salva)\b/.test(t)){ if(total()) { openSave(); say("Salva"); } return; }
  if(/\b(stop|ferma|basta)\b/.test(t)){ stopVoice(); say("Microfono spento"); return; }

  const r=rank(t);
  if(!r.length){ heard(raw+" — no match",1); return; }
  if(r[0].s>=10 && (!r[1]||r[0].s>=r[1].s*1.8)) detail(r[0].n.code);
  else showCands(raw,r);
}
function rank(t){
  let q=t;
  Object.keys(ALIASES).sort(function(a,b){return b.length-a.length;}).forEach(function(it){
    if(q.indexOf(it)>=0) q=q.replace(it,ALIASES[it]);
  });
  const ws=q.split(" ").filter(function(w){return w.length>2&&STOP.indexOf(w)<0;});
  if(!ws.length) return [];
  const out=[];
  TREE.forEach(function(n){
    const nm=norm(n.name), nw=nm.split(/[\s\/(),&\-]+/).filter(Boolean);
    let hits=0,s=0;
    ws.forEach(function(w){
      if(nw.indexOf(w)>=0){ s+=10; hits++; }
      else if(nw.some(function(x){return x.indexOf(w)===0&&w.length>=4;})){ s+=6; hits++; }
      else if(nm.indexOf(w)>=0&&w.length>=5){ s+=3; hits++; }
    });
    if(!hits) return;
    const cov=hits/ws.length;
    if(cov<0.6) return;
    s*=cov; s-=nw.length*0.4;
    if(n.code===t.replace(/\s/g,"")) s+=100;
    if(nm===q) s+=30;
    out.push({n:n,s:s});
  });
  out.sort(function(a,b){return b.s-a.s;});
  return out;
}
function showCands(raw,list){
  const el=document.getElementById("cands");
  CANDS=list.slice(0,4).map(function(x){return x.n;});
  let h='<div class="cl">Which one?</div><div class="cq">“'+raw+'”</div>';
  CANDS.forEach(function(n,i){
    h+='<div class="cand" onclick="pickCand('+i+')"><div class="cn">'+(i+1)+'</div>' +
       '<div><div class="ctn">'+n.name+'</div><div class="ctc">'+n.code+'</div></div></div>';
  });
  h+='<div class="cx" onclick="hideCands()">Cancel</div>';
  el.innerHTML=h; el.style.display="block";
  say("Quale? "+CANDS.map(function(n,i){return (i+1)+". "+n.name;}).join(". "));
}
function hideCands(){ document.getElementById("cands").style.display="none"; CANDS=[]; }
function pickCand(i){ const n=CANDS[i]; hideCands(); if(n) detail(n.code); }

function detail(code){
  const n=byCode[code]; if(!n) return;
  const ch=kids(code);
  go(code);
  if(ch.length) say(n.name+". Contiene: "+ch.map(function(k){return k.name;}).join(", "));
  else{
    const lk=LINKS[code];
    if(lk&&lk.table==="dim_nervous_system"&&NS[lk.code]) say(n.name+". "+NS[lk.code].function);
    else if(lk&&lk.table==="dim_organ_component"&&OC[lk.code])
      say(n.name+". "+OC[lk.code].description);
    else if(lk&&lk.table==="dim_planet"&&PL[lk.code]&&PL[lk.code].body_parts_ruled)
      say(n.name+". Parti del corpo: "+PL[lk.code].body_parts_ruled);
    else say(n.name);
  }
}

async function boot(){
  try{
    await loadRef();
    renderTray(); render();
  }catch(e){
    if(e.message!=="locked") err(e);
  }
}

/* start locked unless a code is already remembered on this device */
if(ACCESS){
  unlockUI();
  boot();
} else {
  document.getElementById("gate").style.display="flex";
}
</script>
